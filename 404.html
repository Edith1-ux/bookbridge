<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — BookBridgee</title>
  <meta name="description" content="The page you are looking for does not exist on BookBridgee.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="logo.png.jpeg">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--color-bg); font-family: var(--font-sans); text-align: center; padding: 24px;">
  <div style="max-width: 480px; background: #fff; padding: 40px 32px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--color-border);">
    <div style="font-size: 64px; font-weight: 900; color: var(--color-primary); line-height: 1; margin-bottom: 12px;">404</div>
    <div style="font-size: 20px; font-weight: 700; color: var(--color-dark); margin-bottom: 8px;">Page Not Found</div>
    <p style="color: var(--color-gray); font-size: 14px; margin-bottom: 24px; line-height: 1.6;">The resource or book page you requested has been moved, renamed, or is unavailable.</p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a href="browse.html" class="btn btn-primary"><i class="fa-solid fa-book"></i> Browse Catalog</a>
      <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-house"></i> Home</a>
    </div>
  </div>
</body>
</html>
