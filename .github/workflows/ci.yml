name: BookBridgee Continuous Integration (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Backend Test Suite & System Checks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "True"
      DJANGO_TEST: "true"
      SECRET_KEY: "ci-testing-secret-key-not-for-production-use"
      REDIS_URL: "redis://localhost:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Check
        run: |
          python backend/manage.py check

      - name: Verify Database Migrations Consistency
        run: |
          python backend/manage.py makemigrations --check

      - name: Run Automated Test Suites
        run: |
          python backend/manage.py test apps.users.tests apps.users.test_security_audit apps.users.test_admin_comprehensive apps.notifications.tests apps.exchange.tests apps.donations.tests apps.core.test_stability apps.core.test_performance apps.core.test_models_crud apps.core.tests apps.chat.tests apps.books.tests apps.admin_portal.tests
