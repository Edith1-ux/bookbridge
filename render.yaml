services:
  - type: web
    name: bookbridge
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      # MySQL Database Configuration (Render MySQL / TiDB / Railway / Aiven)
      # You can provide DATABASE_URL (e.g. mysql://user:password@host:3306/database)
      # OR separate MYSQL_* variables below:
      - key: DATABASE_URL
        sync: false

      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false

      # Allowed CORS origins for external frontends or custom domains
      - key: CORS_ALLOWED_ORIGINS
        sync: false
