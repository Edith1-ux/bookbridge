services:
  - type: web
    name: book-bridge-2
    env: python

    # Build: install deps from backend/requirements.txt, then collect static files
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput"

    # Start: cd into backend/ first so 'config' package is importable, then migrate and run Daphne ASGI
    startCommand: "cd backend && python manage.py migrate --fake-initial --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      # PYTHONPATH is NOT needed when we cd into backend/ before running daphne
      # Keeping it as a safety net for the buildCommand step (collectstatic)
      - key: PYTHONPATH
        value: backend

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DEMO_MODE
        value: "false"

      # MySQL database — set in Render dashboard (sync: false means value is set manually)
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false

      # Redis — set in Render dashboard (required for Django Channels WebSockets)
      - key: REDIS_URL
        sync: false

      # Optional: AI assistant keys
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # Optional: S3-compatible media storage
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      # Optional: CORS / CSRF origins for separate frontend deployment
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Optional: Razorpay payment gateway
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
