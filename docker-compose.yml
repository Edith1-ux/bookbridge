version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bookbridge_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookbridge_db}
      MYSQL_USER: ${MYSQL_USER:-bookbridge_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookbridge_secure_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookbridge_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookbridge_web
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-prod-key-bookbridge-2026}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-bookbridge_db}
      - MYSQL_USER=${MYSQL_USER:-bookbridge_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-bookbridge_secure_pass}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DEMO_MODE=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
